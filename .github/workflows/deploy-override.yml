name: Validate Competition Override

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/data/competition_override.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply competition override
        run: npm run override:apply

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ipomaster

      - name: Deployment note
        run: echo "Cafe24 deployment is handled by the local PM2 scheduler."
